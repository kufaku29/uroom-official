<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Uroom</title>
    <!-- Link FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Tema warna diambil dari logo biru Uroom dan background putih */
            background: linear-gradient(135deg, #2A7CD2, #ffffff, #2A7CD2); 
            background-size: 200% 200%;
            animation: gradientBG 10s ease infinite;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-attachment: fixed;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            padding: 40px 20px;
            /* Biru semi-transparan agar teks tetap terbaca jelas */
            background: rgba(24, 91, 165, 0.85); 
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            margin: 20px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out forwards;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #ffffff; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }
        .desc {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.95;
            color: #E2E8F0; 
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }
        .link-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 30px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            animation: fadeUp 0.6s ease-out forwards;
        }
        .link-btn i {
            margin-right: 10px;
            font-size: 20px;
        }
        .link-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }
        .wa-btn { background-color: #25D366; animation-delay: 0.3s; }
        .ig-btn { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); animation-delay: 0.5s; }
        .tt-btn { background-color: #000000; animation-delay: 0.7s; }
    </style>
</head>
<body>

<div class="container">
    <div class="title">Selamat Datang di Uroom</div>
    
    <img src="foto.jpg" alt="Foto Produk" class="profile-pic">
    
    <div class="desc">Sewa apartemen harian murah by Uroom Official, untuk info lebih lanjut bisa hubungi kami di bawah ini.</div>
    
    <a href="https://wa.me/6285117632845" class="link-btn wa-btn" target="_blank">
        <i class="fab fa-whatsapp"></i> WhatsApp
    </a>
    
    <a href="https://www.instagram.com/uroom_real?stkn=dzZraHluaGo4Ym02" class="link-btn ig-btn" target="_blank">
        <i class="fab fa-instagram"></i> Instagram
    </a>
    
    <a href="https://www.tiktok.com/@uroom_real" class="link-btn tt-btn" target="_blank">
        <i class="fab fa-tiktok"></i> TikTok
    </a>
</div>

</body>
</html>
