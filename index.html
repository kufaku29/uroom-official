<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Uroom</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0B2447 0%, #6883A6 50%, #ffffff 100%); 
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-attachment: fixed;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            padding: 40px 20px;
            background: rgba(11, 36, 71, 0.65); /* Digelapkan sedikit agar teks tetap terbaca di area putih */
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            margin: 20px;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #ffffff; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .desc {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.95;
            color: #E2E8F0; 
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }
        .link-btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 30px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }
        .wa-btn { background-color: #25D366; }
        .ig-btn { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .tt-btn { background-color: #000000; }
    </style>
</head>
<body>

<div class="container">
    <div class="title">Selamat Datang di Uroom</div>
    
    <img src="foto.jpg" alt="Foto Produk" class="profile-pic">
    
    <div class="desc">Sewa apartemen harian murah by Uroom Official, untuk info lebih lanjut bisa hubungi kami di bawah ini.</div>
    
    <a href="https://wa.me/6285117632845" class="link-btn wa-btn" target="_blank">WhatsApp</a>
    
    <a href="https://www.instagram.com/uroom_real?stkn=dzZraHluaGo4Ym02" class="link-btn ig-btn" target="_blank">Instagram</a>
    
    <a href="https://www.tiktok.com/@uroom_real" class="link-btn tt-btn" target="_blank">TikTok</a>
</div>

</body>
</html>
